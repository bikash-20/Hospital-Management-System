services:
  - type: web
    name: openhospital-rms-api
    runtime: docker
    plan: free
    repo: https://github.com/bikash-20/Hospital-Management-System
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Token that gates the manual reseed / password-reset demo endpoints.
      # Set in repo so the Blueprint recreates the service with it configured.
      - key: DEMO_RESET_TOKEN
        value: CareBridgeReset2026Private
      # Enables DemoDataRefresher (auto-seeds today's appointments on startup
      # AND via a daily @Scheduled job at 00:05 Asia/Dhaka so the dashboard
      # never shows 0 0 0 without manual intervention).
      - key: AUTO_RESEED_DEMO
        value: "true"