# Server
server.port=8080

# H2 Database (development)
spring.datasource.url=jdbc:h2:mem:openhospital
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=Y2hhbmdldGhpc3RvYW5nZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbjEyMzQ1Njc4
jwt.expiration-ms=86400000

# Logging
logging.level.com.hospital.rms=DEBUG
logging.level.org.springframework.security=WARN

# Jackson (Jackson 3 defaults to ISO-8601 dates, no timestamps needed)
