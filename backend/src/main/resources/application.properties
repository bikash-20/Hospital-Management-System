# Server
server.port=8080

# H2 Database (development)
spring.datasource.url=jdbc:h2:mem:openhospital
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT — 15 min access, 14 day refresh. The secret below is the well-known dev
# default and is rejected at boot outside the 'dev' profile. Set JWT_SECRET in
# any deployed environment (openssl rand -base64 48).
jwt.secret=Y2hhbmdldGhpc3RvYW5nZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbjEyMzQ1Njc4
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=1209600000

# Auth cookies — httpOnly + SameSite=Lax. Secure flag is off in dev (http://localhost)
# and on in production (HTTPS). Override via APP_COOKIE_SECURE env var.
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}

# Demo reset / reseed token. Set DEMO_RESET_TOKEN on Render to enable the
# /api/setup/reset-password and /api/setup/reseed-today endpoints. Leave
# unset in any real production deployment to fully disable them.
app.demo-reset-token=${DEMO_RESET_TOKEN:}

# Auto-refresh date-bound demo data on startup. When the original DataSeeder
# ran on a previous day, the dashboard's "today" filters return 0 because the
# seeded appointments are stale. Set AUTO_RESEED_DEMO=true on Render so the
# app rebuilds today's appointments, prescriptions and billing on every boot.
# Idempotent — no-op once today's appointments exist. NEVER enable in real
# production (it overwrites appointments).
app.auto-reseed-demo=${AUTO_RESEED_DEMO:false}

# Logging
logging.level.com.hospital.rms=DEBUG
logging.level.org.springframework.security=WARN

# Jackson (Jackson 3 defaults to ISO-8601 dates, no timestamps needed)
