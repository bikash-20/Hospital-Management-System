# ── PostgreSQL (Supabase / any managed Postgres) ────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/openhospital?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP connection pool (Supabase free tier has 60 connections)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# SSL for Supabase (required)
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.sslrootcert=/tmp/root.crt

# JPA - Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway owns the production schema. Existing Supabase databases are baselined
# at version 0 so the initial migration can safely add missing objects.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Set this to the exact Vercel/Netlify origin in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
jwt.secret=${JWT_SECRET:Y2hhbmdldGhpc3RvYW5nZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbjEyMzQ1Njc4}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Disable H2 console
spring.h2.console.enabled=false

# Logging
logging.level.com.hospital.rms=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=INFO
