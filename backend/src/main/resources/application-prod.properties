# ── Production Profile ──────────────────────────────────
# Overrides the dev defaults in application.properties with Supabase Postgres.
# Render injects DATABASE_URL, DB_USERNAME, DB_PASSWORD as env vars.

# Bind to the port Render provides (Render sets $PORT at runtime).
server.port=${PORT:8080}

# Use Supabase PostgreSQL (DATABASE_URL is the JDBC URI set on Render).
# Fall back to local Postgres on docker-compose for local-prod testing.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/openhospital?sslmode=disable}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:hospital}
spring.datasource.password=${DB_PASSWORD:hospital123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable dev-only features
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Quieter logging in prod
logging.level.com.hospital.rms=INFO
logging.level.org.springframework.security=WARN
