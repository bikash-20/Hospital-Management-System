# ── Production Profile ──────────────────────────────────
# Inherits datasource + Hikari from application.properties (Supabase via DATABASE_URL).
# This file only contains prod-specific overrides.

# Bind to the port Render provides (Render sets $PORT at runtime).
server.port=${PORT:8080}

# Disable dev-only features
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Quieter logging in prod
logging.level.com.hospital.rms=INFO
logging.level.org.springframework.security=WARN

# Jackson (Jackson 3 defaults to ISO-8601 dates, no timestamps needed)
